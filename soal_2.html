<!DOCTYPE html>
<html>
<head>
  <title>Tabel Biru Hijau</title>
  <style>
    table {
      border-collapse: collapse;
    }
    td {
      border: 3px solid white;
      width: 60px;
      height: 60px;
    }
  </style>
</head>
<body>

<table>
  <tr>
    <td bgcolor="blue" rowspan="7"></td>
    <td bgcolor="blue" colspan="3"></td>
  </tr>

  <tr>
    <td bgcolor="lime" rowspan="2"></td>
    <td bgcolor="lime" rowspan="3" colspan="2"></td>
    <td bgcolor="blue" rowspan="3"></td>
  </tr>

  <tr></tr>

  <tr>
    <td bgcolor="white"></td>
  </tr>

  <tr>
    <td bgcolor="blue"></td>
    <td bgcolor="white"></td>
    <td bgcolor="blue"></td>
  </tr>

  <tr>
    <td bgcolor="white"></td>
    <td bgcolor="white"></td>
    <td bgcolor="white"></td>
  </tr>

  <tr>
    <td bgcolor="white"></td>
    <td bgcolor="white"></td>
    <td bgcolor="white"></td>
  </tr>
</table>

</body>
</html>
